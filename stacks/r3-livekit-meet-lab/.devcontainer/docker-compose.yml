services:
  bastion:
    image: ubuntu:24.04
    # Keep container alive so VS Code can attach
    command: bash -lc "sleep infinity"
    volumes:
      - ..:/workspace:cached

  transport-server:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  agent-runner:
    build:
      context: ../agent-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../agent-runner/.env.runner
    volumes:
      - ../agent-runner:/app:cached
      - agent-runner-venv:/app/.venv
    ports:
      - "7860:7860"
    depends_on:
      - transport-server

  meet:
    build:
      context: ../meet
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ../meet/.env.local
    environment:
      - BOT_RUNNER_URL=http://agent-runner:7860/
    volumes:
      - ../meet:/app:cached
      - meet-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - transport-server
      - agent-runner

volumes:
  agent-runner-venv:
  meet-node-modules:
