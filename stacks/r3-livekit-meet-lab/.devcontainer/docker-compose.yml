services:
  bastion:
    image: ubuntu:24.04
    # Keep container alive so VS Code can attach
    command: bash -lc "sleep infinity"
    volumes:
      - ..:/workspace:cached

  transport-server:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  agent-runner:
    build:
      context: ../agent-runner
      dockerfile: Dockerfile.local
    restart: unless-stopped
    env_file:
      - ../agent-runner/.env.runner
    volumes:
      - ../agent-runner:/app:cached
      - agent-runner-venv:/app/.venv
    ports:
      - "7860:7860"
    depends_on:
      - transport-server

  web-client:
    build:
      context: ../web-client
      dockerfile: Dockerfile.local
    env_file:
      - ../web-client/.env.web
    volumes:
      - ../web-client:/web:cached
      - web-client-node-modules:/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - transport-server

  meet:
    build:
      context: ../meet
      dockerfile: Dockerfile.local
    env_file:
      - ../meet/.env.local
    volumes:
      - ../meet:/app:cached
      - meet-node-modules:/app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      - transport-server

volumes:
  agent-runner-venv:
  web-client-node-modules:
  meet-node-modules:
