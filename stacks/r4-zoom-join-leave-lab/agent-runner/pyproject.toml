[project]
name = "r4-zoom-join-leave-agent-runner"
version = "0.1.0"
description = "Minimal FastAPI runner for Zoom bot join/leave orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "python-dotenv>=1.1.1",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false
