services:
  bastion:
    image: ubuntu:24.04
    # Keep container alive so VS Code can attach
    command: bash -lc "sleep infinity"
    # Mount your whole workspace at a consistent path
    volumes:
      - .:/workspace:cached

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.local
    volumes:
      - ./web:/web:cached
    ports:
      - "3000:3000"
