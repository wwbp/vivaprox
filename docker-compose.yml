services:
  bastion:
    image: ubuntu:24.04
    # Keep container alive so VS Code can attach
    command: bash -lc "sleep infinity"
    volumes:
      - .:/workspace:cached

  server-media:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile.local
    volumes:
      - ./web-client:/web:cached
    ports:
      - "3000:3000"
    depends_on:
      - server-media
